[project]
name = "bmu-lab"
version = "0.1.0"
description = "BMU Lab — digital laboratory service & queue management"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0.30",
    "alembic>=1.13",
    "psycopg[binary]>=3.2",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "email-validator>=2.2",
    "argon2-cffi>=23.1",
    "pyotp>=2.9",
    "pyjwt>=2.9",
    "cryptography>=43",
    "celery[redis]>=5.4",
    "redis>=5.0",
    "boto3>=1.35",
    "httpx>=0.27",
    "python-multipart>=0.0.9",
    "jinja2>=3.1",
    "pyyaml>=6.0",
    "weasyprint>=62",
    "python-barcode>=0.15",
    "segno>=1.6",
    "pillow>=10.4",
    "pypdf>=5.0",
    "prometheus-client>=0.20",
    "pyhanko>=0.25",
    "pywebpush>=2.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-timeout>=2.3",
    "ruff>=0.6",
    "mypy>=1.11",
    "types-pyyaml",
    "types-python-dateutil",
    "boto3-stubs[s3]",
    "pypdfium2>=4.30",
    "pyzbar>=0.1.9",
    "pip-audit>=2.7",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "RUF", "N", "C4", "PIE", "RET"]
ignore = [
    "S101",   # assert in tests
    "B008",   # FastAPI Depends() in defaults
    "RUF001", "RUF002", "RUF003",  # Bangla text is intentional
    "S311",   # random for non-crypto use is flagged per call site
    "N818",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "B017", "N802"]
"app/modules/documents/**" = ["E501"]
"app/config.py" = ["S105"]
"app/seeding.py" = ["S105"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
files = ["app"]
exclude = ["app/scripts/"]

[[tool.mypy.overrides]]
module = ["app.workers.celery_app"]
disallow_untyped_decorators = false

[[tool.mypy.overrides]]
module = ["barcode.*", "segno.*", "weasyprint.*", "celery.*", "kombu.*", "pyzbar.*", "pypdfium2.*", "pyhanko.*", "pyhanko_certvalidator.*", "pywebpush.*", "prometheus_client.*", "botocore.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
pythonpath = ["."]
markers = [
    "pdf: needs WeasyPrint (Pango/HarfBuzz) — runs in the Docker image",
    "concurrency: real parallel sessions",
]
timeout = 120
