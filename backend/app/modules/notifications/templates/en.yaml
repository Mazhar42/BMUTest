# SMS templates (English). Keep every message within 2 SMS segments (see tests/unit/test_sms_templates.py).
# {code} = order code with dashes, {amount} = taka in the message language, {link} = short patient link.
otp: "BMU Lab code: {otp}. Valid for 5 minutes. Do not share it with anyone."
