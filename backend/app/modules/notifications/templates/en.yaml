order_rejected: "BMU Lab {code}: your request could not be accepted. Please contact the help desk."
walkin_created: "BMU Lab code {code}. Amount Tk {amount}. Pay at the bank booth using this code."
waiver_approved: "BMU Lab {code}: fee waiver approved. Amount payable Tk {amount}."
